<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="m_UiW6ZKF30NmF2JvWQEvtPUf-1N2UkLPKgXd7aTEm4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="提供最準確的線上健康計算工具，包含 BMI 指數、基礎代謝率 BMR 及 TDEE 計算，並提供專業的營養建議，助您達成理想體態。">
    <title>健康數據計算器 - 線上 BMI、BMR、TDEE 計算工具，追蹤你的體重變化</title>
    <link rel="stylesheet" href="健康數據計算器.css">
    <link rel="manifest" href="manifest健康數據計算器.json">

    <meta property="og:title" content="健康數據計算器 - 追蹤體態的好夥伴BMI/BMR/TDEE計算">
    <meta property="og:description" content="一鍵計算 BMI/BMR/TDEE，還能幫你記錄體重變化圖！">
    <meta property="og:image" content="https://github.com/oyyj0101/health-calculator-website/blob/main/%E5%81%A5%E5%BA%B7%E6%95%B8%E6%93%9A%E8%A8%88%E7%AE%97%E5%99%A8images/512icon.png">
    <meta property="og:url" content="https://oyyj0101.github.io/health-calculator-website/">
    <meta property="og:type" content="website">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./Offline健康數據計算器.js');
        }
    </script>
</head>
<body>

    <div class="container">
        <h1>健康數據計算器</h1>

        <div class="nav-toggle">
            <div class="slider"></div>
            <div class="nav-item active" onclick="switchPage('calc', this)">計算器</div>
            <div class="nav-item" onclick="switchPage('record', this)">數據紀錄</div>
            <div class="nav-item" onclick="switchPage('chart', this)">圖表</div>
        </div>

        <div id="page-calc" class="page-content active">
            <div class="calculator-card">
                <div class="input-row">
                    <label>性別</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="male" checked>
                            <label for="male" class="inline-label">男性</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female" class="inline-label">女性</label>
                        </div>
                    </div>
                </div>

                <div class="input-row">
                    <label for="age">年齡</label>
                    <input type="number" id="age" placeholder="例如: 25">
                </div>

                <div class="input-row">
                    <label for="weight">體重(kg)</label>
                    <input type="number" id="weight" placeholder="例如: 70">
                </div>

                <div class="input-row">
                    <label for="height">身高(cm)</label>
                    <input type="number" id="height" placeholder="例如: 175">
                </div>

                <div class="input-row">
                    <label for="activity">活動量</label>
                    <select id="activity">
                        <option value="1.2">久坐(辦公族、幾乎無運動)</option>
                        <option value="1.375">輕度(每周運動1-3天)</option>
                        <option value="1.55">中度(每週運動3-5天)</option>
                        <option value="1.725">高度(每週運動6-7天)</option>
                        <option value="1.9">重度(高強度運動、勞動工作)</option>
                    </select>
                </div>

                <div class="input-row" style="align-items: flex-start;">
                    <label for="daily-note">今日備註</label>
                    <textarea id="daily-note" placeholder="紀錄今天的飲食或運動狀況..."></textarea>
                </div>

                <button onclick="calculate()">開始計算</button>
            </div>
            
            <div id="results" class="results-card" style="display: none;">
                <h2>計算結果</h2>
                <div class="result-item">
                    <span>BMI指數:</span>
                    <strong id="bmi-val">0</strong>
                </div>
                <div class="result-item">
                    <span>基礎代謝率(BMR):</span>
                    <strong id="bmr-val">0</strong> kcal
                </div>
                <div class="result-item highlight">
                    <span>總熱量消耗(TDEE):</span>
                    <strong id="tdee-val">0</strong> kcal
                </div>
                <p id="bmi-status"></p>
                <button onclick="saveRecord()" style="margin-top: 20px; background-color: var(--secondary-color); color: white; border: none;">儲存本次紀錄</button>
            </div>
        </div>

        <div id="page-record" class="page-content">
            <div class="calculator-card">
                <h2>數據紀錄</h2>
                <div id="record-list">
                    <p style="color: #999; text-align: center;">尚無紀錄</p>
                </div>
            </div>
        </div>

        <div id="page-chart" class="page-content">
            <div class="calculator-card">
                <h2>體重趨勢圖</h2>
                <div class="chart-container" style="position: relative; height:300px; width:100%;">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>
        </div>

    </div> 

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="健康數據計算器.js"></script>
</body>
</html>
